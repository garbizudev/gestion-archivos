# Infraestructura de desarrollo: almacenamiento compatible con S3 (SeaweedFS).
# La base de datos PostgreSQL es una instancia externa (ver backend/.env.example).
# Uso: docker compose up -d
name: gestion-archivos

services:
  # Bucket privado compatible con la API de S3. En producción se reemplaza por AWS S3
  # cambiando solo las variables S3_* del backend.
  s3:
    image: chrislusf/seaweedfs:4.47
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "${S3_PORT:-8333}:8333"
    volumes:
      - s3_data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  s3_data:
