@if (auth.user(); as user) {
  <section class="welcome-card">
    <h1>Bienvenido, {{ user.fullName }}</h1>

    <dl class="profile">
      <dt>Correo</dt>
      <dd>{{ user.email }}</dd>

      <dt>Rol</dt>
      <dd>{{ user.roleName }}</dd>

      <dt>Área</dt>
      <dd>{{ user.areaName ?? 'Sin área' }}</dd>

      @if (user.managedAreas.length > 0) {
        <dt>Áreas que gestiona</dt>
        <dd>
          @for (area of user.managedAreas; track area.id) {
            <span class="chip">{{ area.name }}</span>
          }
        </dd>
      }
    </dl>

    <button mat-flat-button (click)="logout()">
      <mat-icon>logout</mat-icon>
      Cerrar sesión
    </button>
  </section>
}
